<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>수리이력 검색 · 시스멕스톡 2016-2026</title>
<style>
:root{--pri:#005BAC;--sec:#00B8EE;--ok:#3FBA46;--warn:#E69E0B;--bad:#E7413E;--tx:#3F3F3F;--sub:#5E6977;--line:#DDDDDD;--card:#F7F9FC;--soft:#EAF2FB;--bg:#fff;--hl:#FFF1B8;
 --font:Pretendard,"Malgun Gothic","맑은 고딕",Arial,sans-serif}
@media(prefers-color-scheme:dark){:root{--tx:#E6EAF0;--sub:#A3AEBD;--line:#34404F;--card:#18212C;--soft:#1B2B40;--bg:#0F1620;--hl:#6B5A10;--pri:#5BA8E8}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--font);font-size:15px;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding:12px 14px 80px}
header{display:flex;align-items:center;gap:10px;margin:2px 0 10px}
header img{height:20px;width:auto}
header h1{font-size:18px;margin:0;color:var(--pri);font-weight:700}
header .sub{font-size:12px;color:var(--sub);margin-left:auto;text-align:right}
.sbox{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0 8px}
.srow{display:flex;gap:8px}
.srow input{flex:1;min-width:0;font:inherit;font-size:16px;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--tx);outline:none}
.srow input:focus{border-color:var(--pri)}
.btn{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:10px;padding:9px 13px;cursor:pointer;min-height:40px}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
.btn:disabled{opacity:.5}
.chips{display:flex;gap:6px;overflow-x:auto;padding:7px 0 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chips .lb{flex:none;font-size:12px;color:var(--sub);align-self:center;margin-right:2px}
.chip{flex:none;font:inherit;font-size:13px;border:1px solid var(--line);background:var(--bg);color:var(--tx);border-radius:999px;padding:6px 12px;cursor:pointer;min-height:34px;white-space:nowrap}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.chip small{opacity:.75;margin-left:3px}
.opts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:6px}
.opts select,.opts input{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--bg);color:var(--tx);border-radius:8px;padding:7px 8px;min-height:36px;max-width:100%}
.opts input{width:130px}
.status{font-size:13px;color:var(--sub);margin:8px 0 4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.status b{color:var(--tx)}
.prog{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin:4px 0 0}
.prog i{display:block;height:100%;background:var(--sec);width:0;transition:width .25s}
.yrs{display:flex;align-items:flex-end;gap:3px;height:46px;margin:6px 0 8px}
.yr{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;cursor:pointer;height:100%}
.yr i{display:block;width:100%;background:var(--soft);border-radius:3px 3px 0 0;min-height:2px}
.yr.on i{background:var(--pri)}
.yr span{font-size:10px;color:var(--sub);margin-top:2px}
.card{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;margin:8px 0}
.meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-bottom:5px}
.meta .dt{color:var(--tx);font-weight:600}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--soft);color:var(--pri);font-weight:600}
.tag.t1{background:#FDF1D8;color:#8A5A00}.tag.t2{background:#E3F4E4;color:#1E6B24}.tag.t3{background:#E6EEF8;color:#005BAC}
@media(prefers-color-scheme:dark){.tag.t1{background:#4A3A12;color:#F2C969}.tag.t2{background:#1C3A20;color:#8FD994}.tag.t3{background:#1B2B40;color:#8EC3F2}}
.txt{white-space:pre-wrap;word-break:break-word;font-size:14.5px;max-height:11.5em;overflow:hidden;position:relative}
.txt.open{max-height:none}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px}
.acts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.acts .btn{font-size:12.5px;padding:5px 10px;min-height:32px}
.empty{text-align:center;color:var(--sub);padding:28px 8px;font-size:14px}
.ex{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.tip{font-size:12.5px;color:var(--sub);background:var(--soft);border-radius:10px;padding:8px 12px;margin:8px 0}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .in{background:var(--bg);width:100%;max-width:760px;max-height:86vh;border-radius:16px 16px 0 0;display:flex;flex-direction:column}
.sheet .hd{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700;color:var(--pri)}
.sheet .hd .btn{margin-left:auto}
.sheet .bd{overflow:auto;padding:8px 14px 24px}
.ctx{padding:7px 10px;border-radius:10px;margin:5px 0;font-size:14px;white-space:pre-wrap;word-break:break-word}
.ctx.me{background:var(--soft);border:1.5px solid var(--pri)}
.ctx .who{font-size:11.5px;color:var(--sub)}
.gate{max-width:420px;margin:60px auto;text-align:center;color:var(--sub)}
.gate h2{color:var(--pri)}
#adm{margin-left:6px}
</style>
</head>

function hlHtml(raw,hl){if(!hl)return esc(raw);let out="",last=0,m;hl.lastIndex=0;while((m=hl.exec(raw))){if(!m[0]){hl.lastIndex++;continue;}out+=esc(raw.slice(last,m.index))+"<mark>"+esc(m[0])+"</mark>";last=m.index+m[0].length;}return out+esc(raw.slice(last));}
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function fmtDate(m){const d=new Date(Date.UTC(2016,0,1)+m*60000),p=x=>String(x).padStart(2,"0");return d.getUTCFullYear()+"."+p(d.getUTCMonth()+1)+"."+p(d.getUTCDate())+" "+p(d.getUTCHours())+":"+p(d.getUTCMinutes());}
function dayOf(m){return Math.floor(m/1440);}

async function gunzip(u8){
  if(typeof DecompressionStream==="undefined")throw new Error("이 브라우저는 압축 해제를 지원하지 않습니다. 최신 크롬·사파리(16.4 이상)를 사용해 주세요.");

}
function bsearch(offs,pos,n){let lo=0,hi=n-1;while(lo<hi){const mid=(lo+hi+1)>>1;if(offs[mid]<=pos)lo=mid;else hi=mid-1;}return lo;}

/* ---------- 청크 만들기 ---------- */
function buildChunk(k,rows){
  const n=rows.length,offs=new Int32Array(n+1),ts=new Int32Array(n),sd=new Uint16Array(n),ty=new Uint8Array(n),fm=new Int32Array(n),parts=new Array(n);
  let p=0;
  for(let i=0;i<n;i++){const r=rows[i];ts[i]=r[0];sd[i]=r[1];ty[i]=r[2];fm[i]=r[3];offs[i]=p;parts[i]=r[4];p+=r[4].length+1;}
  offs[n]=p;
  return {k,y:yearOfKey(k),n,offs,ts,sd,ty,fm,S:parts.join("\u0001")+"\u0001"};
}
const txtAt=(c,i)=>c.S.substring(c.offs[i],c.offs[i+1]-1);

async function idbGet(k){try{const d=await idbOpen();return await new Promise(res=>{const q=d.transaction("c").objectStore("c").get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null);});}catch(e){return null;}}
async function idbSet(k,v){try{const d=await idbOpen();await new Promise(res=>{const t=d.transaction("c","readwrite");t.objectStore("c").put(v,k);t.oncomplete=res;t.onerror=res;});}catch(e){}}

/* ---------- 검색 ---------- */
function parseQuery(s){
  const pos=[],neg=[];
  const re=/(-?)"([^"]+)"|(\S+)/g;let m;
  while((m=re.exec(s))){
    if(m[2]!==undefined){(m[1]?neg:pos).push(m[2].trim());}
    else{let t=m[3];if(t.length>1&&t[0]==="-"){neg.push(t.slice(1));}else pos.push(t);}
  }
  return {pos:pos.filter(Boolean),neg:neg.filter(Boolean)};
}
function tokRe(tok,flags){
  const norm=tok.replace(/[-_.]/g,"");
  const ch=[...(norm||tok)].map(c=>c.replace(/[.*+?^${}()|[\]\\\/]/g,"\\$&"));
  return new RegExp(ch.join("[ \\-_.]?"),flags);
}
function periodRange(){
  const p=state.per;if(p==="all")return null;
  const last=Math.max(...CH.map(c=>c.n?c.ts[c.n-1]:0));
  if(p==="1y")return [last-365*1440,1e9];
  if(p==="3y")return [last-3*365*1440,1e9];
  return null;
}
function runSearch(){
  const P=parseQuery(state.q);
  const pos=P.pos.map(t=>tokRe(t,"i")),neg=P.neg.map(t=>tokRe(t,"i"));
  let scanIdx=-1,maxLen=0;P.pos.forEach((t,i)=>{if(t.length>maxLen){maxLen=t.length;scanIdx=i;}});
  const fmask=[...state.fam].reduce((a,i)=>a|(1<<i),0);
  const tset=state.typ,who=state.who.trim();
  let whoIdx=null;
  if(who){whoIdx=new Set();META.senders.forEach((s,i)=>{if(s.toLowerCase().includes(who.toLowerCase()))whoIdx.add(i);});}
  const pr=periodRange();
  const yrSel=state.per.startsWith("y")?+state.per.slice(1):(state.yr||null);
  HITS=[];TOTAL=0;FAMCNT=new Array(META.fam.length).fill(0);YRCNT={};
  for(const c of CH){
    const hits=[];
    const pass=i=>{
      if(fmask&&!(c.fm[i]&fmask))return false;
      if(tset.size&&!tset.has(c.ty[i]))return false;
      if(whoIdx&&!whoIdx.has(c.sd[i]))return false;
      if(pr&&(c.ts[i]<pr[0]||c.ts[i]>pr[1]))return false;
      return true;
    };
    const rest=(i)=>{
      if(pos.length>1||neg.length){
        const t=txtAt(c,i);
        for(let j=0;j<pos.length;j++){if(j===scanIdx)continue;if(!pos[j].test(t))return false;}
        for(const r of neg)if(r.test(t))return false;
      }
      return true;
    };
    const yearOK=!yrSel||c.y===yrSel;
    if(scanIdx<0){
      if(yearOK)for(let i=0;i<c.n;i++)if(pass(i)&&rest(i))hits.push(i);
    }else if(yearOK){
      const sc=new RegExp(pos[scanIdx].source,"gi");let m;
      while((m=sc.exec(c.S))){
        const i=bsearch(c.offs,m.index,c.n);
        sc.lastIndex=c.offs[i+1];
        if(pass(i)&&rest(i))hits.push(i);
      }
    }
    if(hits.length){
      HITS.push({c,hits});TOTAL+=hits.length;
      YRCNT[c.y]=(YRCNT[c.y]||0)+hits.length;
      for(const i of hits){const f=c.fm[i];if(f)for(let b=0;b<FAMCNT.length;b++)if(f&(1<<b))FAMCNT[b]++;}
    }
  }
}
/* ---------- 화면 ---------- */
let timer=null;
function scheduleSearch(ms){clearTimeout(timer);timer=setTimeout(doSearch,ms===undefined?220:ms);}
function doSearch(){
  if(!META||!CH.length){return;}
  runSearch();
  let ycnt=YRCNT;
  if(state.yr&&!state.per.startsWith("y")){const keep=state.yr;state.yr=null;runSearch();ycnt=Object.assign({},YRCNT);state.yr=keep;runSearch();}
  drawChips();drawYears(ycnt);
  state.shown=0;$("#res").innerHTML="";
  const loading=CH.length<META.chunks.length;
  const parts=[];
  parts.push("<b>"+N(TOTAL)+"건</b>");
  if(loading)parts.push("지금까지 불러온 기간 기준(최신부터 불러오는 중)");
  $("#st").innerHTML=parts.join(" · ");
  $("#tip").style.display=(state.q||state.fam.size||state.typ.size)?"none":"block";
  if(!TOTAL){$("#res").innerHTML='<div class="empty">검색 결과가 없습니다.<br>철자를 줄이거나(예: <b>leak</b>) 필터를 풀어 보세요.</div>';$("#more").style.display="none";return;}
  more();
}
function* iter(){
  const arr=state.ord==="d"?HITS:HITS.slice().reverse();
  for(const h of arr){
    const L=h.hits;
    if(state.ord==="d"){for(let j=L.length-1;j>=0;j--)yield [h.c,L[j]];}
    else{for(let j=0;j<L.length;j++)yield [h.c,L[j]];}
  }
}
let IT=null;
function more(){
  if(state.shown===0)IT=iter();
  const P=parseQuery(state.q);const hl=P.pos.length?new RegExp(P.pos.map(t=>tokRe(t,"").source).join("|"),"gi"):null;
  const frag=document.createDocumentFragment();let k=0;
  while(k<40){
    const nx=IT.next();if(nx.done)break;
    const [c,i]=nx.value;frag.appendChild(card(c,i,hl));k++;state.shown++;
  }
  $("#res").appendChild(frag);
  $("#more").style.display=state.shown<TOTAL?"inline-block":"none";
  if(state.shown<TOTAL)$("#more").textContent="더 보기 ("+N(TOTAL-state.shown)+"건 남음)";
  requestAnimationFrame(()=>document.querySelectorAll(".txt:not(.chk)").forEach(e=>{e.classList.add("chk");if(e.scrollHeight>e.clientHeight+4){const b=document.createElement("button");b.className="btn";b.textContent="펼치기";b.onclick=()=>{e.classList.toggle("open");b.textContent=e.classList.contains("open")?"접기":"펼치기";};e.parentNode.querySelector(".acts").prepend(b);}}));
}
function card(c,i,hl){
  const t=txtAt(c,i);
  const d=document.createElement("div");d.className="card";
  const fams=[];for(let b=0;b<META.fam.length;b++)if(c.fm[i]&(1<<b))fams.push(META.fam[b]);
  const tyN=META.typ[c.ty[i]];
  const body=hlHtml(t.replace(/ \/ /g,"\n").replace(/\n{3,}/g,"\n\n"),hl);
  d.innerHTML='<div class="meta"><span class="dt">'+fmtDate(c.ts[i])+'</span><span>'+esc(META.senders[c.sd[i]]||"")+'</span>'+
    (c.ty[i]?'<span class="tag '+TYPE_CLS[c.ty[i]]+'">'+tyN+'</span>':'')+fams.slice(0,4).map(f=>'<span class="tag">'+f+'</span>').join("")+'</div>'+
    '<div class="txt">'+body+'</div><div class="acts"><button class="btn" data-a="ctx">앞뒤 대화</button><button class="btn" data-a="cp">복사</button></div>';
  d.querySelector('[data-a="ctx"]').onclick=()=>showCtx(c,i);
  d.querySelector('[data-a="cp"]').onclick=e=>{navigator.clipboard&&navigator.clipboard.writeText(t).then(()=>{e.target.textContent="복사됨";setTimeout(()=>e.target.textContent="복사",1200);});};
  return d;
}
function showCtx(c,i){
  const day=dayOf(c.ts[i]),lo0=Math.max(0,i-8),hi0=Math.min(c.n-1,i+8);
  let lo=i,hi=i;while(lo>lo0&&dayOf(c.ts[lo-1])===day)lo--;while(hi<hi0&&dayOf(c.ts[hi+1])===day)hi++;
  let h="";
  for(let j=lo;j<=hi;j++){
    h+='<div class="ctx'+(j===i?' me':'')+'"><div class="who">'+fmtDate(c.ts[j]).slice(11)+' · '+esc(META.senders[c.sd[j]]||"")+'</div>'+esc(txtAt(c,j).replace(/ \/ /g,"\n"))+'</div>';
  }
  $("#shT").textContent=fmtDate(c.ts[i]).slice(0,10)+" 앞뒤 대화 (같은 날, 노이즈 제외)";
  $("#shB").innerHTML=h;$("#sheet").classList.add("on");
  const me=$("#shB .me");if(me)me.scrollIntoView({block:"center"});
}
function drawChips(){
  const fc=$("#fchips");fc.querySelectorAll(".chip").forEach(e=>e.remove());
  const order=META.fam.map((f,i)=>i).filter(i=>FAMCNT[i]>0||state.fam.has(i)).sort((a,b)=>FAMCNT[b]-FAMCNT[a]);
  for(const i of order){
    const b=document.createElement("button");b.className="chip"+(state.fam.has(i)?" on":"");
    b.innerHTML=META.fam[i]+"<small>"+N(FAMCNT[i])+"</small>";
    b.onclick=()=>{state.fam.has(i)?state.fam.delete(i):state.fam.add(i);scheduleSearch(0);};
    fc.appendChild(b);
  }
  const tc=$("#tchips");tc.querySelectorAll(".chip").forEach(e=>e.remove());
  META.typ.forEach((n,i)=>{if(i===0)return;
    const b=document.createElement("button");b.className="chip"+(state.typ.has(i)?" on":"");b.textContent=n;
    b.onclick=()=>{state.typ.has(i)?state.typ.delete(i):state.typ.add(i);scheduleSearch(0);};tc.appendChild(b);});
  const b0=document.createElement("button");b0.className="chip"+(state.typ.has(0)?" on":"");b0.textContent="일반 대화";
  b0.onclick=()=>{state.typ.has(0)?state.typ.delete(0):state.typ.add(0);scheduleSearch(0);};tc.appendChild(b0);
}
function drawYears(cnt){
  const ys=[];for(let y=+META.from.slice(0,4);y<=+META.to.slice(0,4);y++)ys.push(y);
  const mx=Math.max(1,...ys.map(y=>cnt[y]||0));
  $("#yrs").innerHTML=ys.map(y=>'<div class="yr'+(state.yr===y||state.per==="y"+y?" on":"")+'" data-y="'+y+'" title="'+y+'년 '+N(cnt[y]||0)+'건"><i style="height:'+Math.max(3,(cnt[y]||0)/mx*34)+'px"></i><span>'+String(y).slice(2)+'</span></div>').join("");
  $("#yrs").querySelectorAll(".yr").forEach(e=>e.onclick=()=>{const y=+e.dataset.y;state.yr=(state.yr===y)?null:y;state.per="all";$("#per").value="all";scheduleSearch(0);});
}

    Array.from({length:+META.to.slice(0,4)-+META.from.slice(0,4)+1},(_,i)=>+META.to.slice(0,4)-i).map(y=>'<option value="y'+y+'">'+y+'년</option>').join("");

  $("#more").onclick=more;

/* ---------- 관리자: 데이터 올리기 ---------- */
function adminUI(parent){

    try{

  };
}

(async function boot(){

    if(!E)await fbInit();
    META=await getMeta();
    if(!META||!META.chunks){gate("<h2>아직 자료가 없습니다</h2><p>관리자가 이력 자료를 올리면 여기서 검색할 수 있어요.</p>");if(isAdmin&&!E)adminUI($("#gate"));return;}

  }catch(e){
    console.error(e);
    if(e.code==="noauth")gate("<h2>로그인이 필요해요</h2><p>FS 포털에서 로그인(승인)한 뒤 다시 열어 주세요.</p>");
    else if(/permission/i.test(e.message||e.code))gate("<h2>승인된 직원만 볼 수 있어요</h2><p>FS 포털 가입 승인 후 이용할 수 있습니다.</p>");
    else gate("<h2>불러오지 못했습니다</h2><p>"+esc(e.message||String(e))+"</p>");
  }
})();
</script>
</body>
</html>
