<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A3A6B">
<title>FS Talk</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#005BAC;--cyan:#00B8EE;--navy:#1A3A6B;--bg:#F4F6F9;--panel:#fff;--line:#E1E6EE;--text:#1C2430;--sub:#5F6B7A;--mine:#E6F1FB;--mark:#FFE58A;--bad:#C8102E;--ok:#1E8E5A}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:'Noto Sans KR',system-ui,sans-serif;color:var(--text);background:var(--bg);font-size:14px}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
[hidden]{display:none!important}
.app{display:grid;grid-template-columns:68px 300px 1fr;height:100vh}
.app.info-on{grid-template-columns:68px 300px 1fr 260px}
/* 왼쪽 아이콘 레일 */
.rail{background:var(--blue);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px}
.rail .logo{width:40px;height:40px;border-radius:12px;background:#fff;color:var(--blue);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:15px;margin-bottom:12px}
.rail button{position:relative;width:48px;height:48px;border:0;border-radius:12px;background:none;color:rgba(255,255,255,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px}
.rail button .ri{font-size:20px;line-height:1}
.rail button:hover{background:rgba(255,255,255,.12);color:#fff}
.rail button.on{background:rgba(255,255,255,.22);color:#fff}
.rail .grow{flex:1}
.rail .meav{margin-top:6px}
.dot{position:absolute;top:4px;right:4px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:#FF4D4F;color:#fff;font-size:10px;font-weight:700;line-height:16px;text-align:center}
/* 목록 패널 */
.list{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.lhead{padding:16px 16px 10px}
.lhead h2{margin:0 0 10px;font-size:18px;display:flex;align-items:center;gap:8px}
.lhead h2 small{font-size:12px;color:var(--sub);font-weight:400}
.lsearch{width:100%;border:0;background:#F1F3F6;border-radius:8px;padding:9px 12px}
.litems{flex:1;overflow:auto;padding:0 6px 10px}
.lgrp{font-size:11px;color:var(--sub);padding:12px 10px 4px;font-weight:500}
.li{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:10px;color:var(--text)}
.li:hover{background:#F4F6F9}
.li.on{background:#E6F1FB}
.li.sub{padding-left:22px}
.li .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.li .nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .nm small{font-weight:400;color:var(--sub);font-size:12px;margin-left:4px}
.li .pv{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .rt{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.li .tm{font-size:11px;color:#98A2B0}
.cnt{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#FF4D4F;color:#fff;font-size:11px;font-weight:700;line-height:20px;text-align:center}
.me{padding:10px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--sub)}
/* 아바타 */
.av{flex:none;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;letter-spacing:-.5px}
.av.sq{border-radius:12px;font-size:12px}
.av.s{width:32px;height:32px;font-size:11px}
/* 대화 영역 */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:#EEF2F7}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);min-height:60px}
.top h2{margin:0;font-size:16px}
.top .desc{color:var(--sub);font-size:12px}
.top .grow{flex:1}
.top .tb{background:none;border:0;font-size:18px;color:var(--sub);width:36px;height:36px;border-radius:8px}
.top .tb:hover{background:#F1F3F6}
.menu{display:none;background:none;border:0;font-size:20px;padding:2px 6px}
.banner{background:#FFF4E5;color:#8A4B00;font-size:12px;padding:6px 18px;border-bottom:1px solid #F3D9B5}
.view{flex:1;min-height:0;display:none}
.view.on{display:flex;flex-direction:column}
.msgs{flex:1;overflow:auto;padding:14px 18px;display:flex;flex-direction:column}
.empty{margin:auto;color:var(--sub);text-align:center;line-height:1.7}
.day{align-self:center;font-size:11px;color:#fff;background:rgba(26,58,107,.35);padding:3px 12px;border-radius:12px;margin:12px 0 6px}
.row{display:flex;gap:8px;align-items:flex-start;margin-top:10px;max-width:100%}
.row.cont{margin-top:3px}
.row .avs{width:40px;flex:none}
.row .col{display:flex;flex-direction:column;gap:3px;min-width:0;max-width:min(620px,75%)}
.row .who{font-size:12px;color:#4A5565;display:flex;align-items:center;gap:6px}
.row .line{display:flex;align-items:flex-end;gap:6px}
.row .meta2{font-size:10px;color:#8A94A3;white-space:nowrap;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.bubble{background:#fff;border-radius:4px 14px 14px 14px;padding:8px 12px;white-space:pre-wrap;word-break:break-word;line-height:1.5;box-shadow:0 1px 1px rgba(0,0,0,.05)}
.row.cont .bubble{border-radius:14px}
.row.mine{justify-content:flex-end}
.row.mine .col{align-items:flex-end}
.row.mine .line{flex-direction:row-reverse}
.row.mine .meta2{align-items:flex-start}
.row.mine .bubble{background:var(--blue);color:#fff;border-radius:14px 4px 14px 14px;cursor:pointer}
.row.mine.cont .bubble{border-radius:14px}
.row.mine .tag{color:#BFE6FF}
.row .del{display:none;font-size:11px;color:var(--bad);background:#fff;border:1px solid #F1C2CA;border-radius:6px;padding:1px 7px}
.row.sel .del{display:inline-block}
.row.adm .bubble{cursor:pointer}
.tag{color:var(--blue);font-weight:500}
mark{background:var(--mark);color:#1C2430;border-radius:2px;padding:0 1px}
.composer{display:flex;gap:8px;padding:10px 14px;background:#fff;border-top:1px solid var(--line);align-items:flex-end}
.composer textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:20px;padding:9px 14px;min-height:40px;max-height:160px;line-height:1.5;min-width:0;background:#F7F9FC}
.composer .btn{border-radius:20px;flex:none}
/* 오른쪽 방 정보 */
.info{background:#fff;border-left:1px solid var(--line);display:none;flex-direction:column;min-height:0}
.app.info-on .info{display:flex}
.info .ih{padding:18px 16px 12px;border-bottom:1px solid var(--line);text-align:center}
.info .ih .av{margin:0 auto 8px;width:56px;height:56px;font-size:15px}
.info .ih b{display:block;font-size:15px}
.info .ih span{font-size:12px;color:var(--sub)}
.info .il{flex:1;overflow:auto;padding:6px 8px}
.info .mem{display:flex;align-items:center;gap:10px;padding:7px 8px;font-size:13px}
.info .mem small{color:var(--sub);font-size:11px}
.tabbar{display:none}
textarea:focus,input:focus,select:focus{outline:2px solid #BFDDF5;border-color:var(--blue)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 14px;color:var(--text);white-space:nowrap}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{background:#004A8D;color:#fff}
.btn.bad{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.sw{flex:1;overflow:auto;padding:16px 18px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.filters input,.filters select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff}
.filters input[type=search]{flex:1;min-width:220px}
.hint{font-size:12px;color:var(--sub);margin-bottom:12px;line-height:1.6}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:#fff;border-radius:14px;padding:3px 10px;font-size:12px;color:var(--sub)}
.chip:hover{border-color:var(--blue);color:var(--blue)}
.sum{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px}
.res{display:flex;flex-direction:column;gap:8px}
.hit{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}
.hit:hover{border-color:var(--blue)}
.hit .meta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--sub);margin-bottom:4px}
.rb{font-size:11px;padding:1px 8px;border-radius:10px;background:#E6F1FB;color:var(--blue);font-weight:500}
.hit .tx{white-space:pre-wrap;word-break:break-word;line-height:1.55;font-size:13px}
.more{color:var(--sub);font-size:12px;text-align:center;padding:8px}
/* gate screens */
.gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px;width:min(420px,100%)}
.card h1{margin:0 0 4px;font-size:20px;color:var(--navy)}
.card p{color:var(--sub);line-height:1.6;margin:6px 0 16px}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.f label{font-size:12px;color:var(--sub)}
.f input,.f select{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:16px;background:#fff}
.card .btn.pri{width:100%;padding:11px;font-size:15px}
.plist{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
.plist .grp{font-size:11px;color:var(--sub);background:#F4F6F9;padding:5px 12px;position:sticky;top:0}
.plist button{display:flex;justify-content:space-between;width:100%;text-align:left;background:#fff;border:0;border-top:1px solid #EEF1F5;padding:12px;font-size:15px}
.plist button:hover,.plist button.on{background:#E6F1FB}
.plist button small{color:var(--sub);font-size:12px}
.plist .none{padding:14px;color:var(--sub);font-size:13px;text-align:center}
.psel{background:#E6F1FB;border:1px solid #C9DFF5;border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:14px}
.linkbtn{background:none;border:0;color:var(--blue);font-size:13px;padding:4px 0 12px;text-decoration:underline}
.rost{width:100%;min-height:220px;border:1px solid var(--line);border-radius:8px;padding:10px;font-family:ui-monospace,monospace;font-size:13px}
.uid{font-family:ui-monospace,monospace;font-size:11px;color:var(--sub);word-break:break-all;background:#F4F6F9;border-radius:6px;padding:6px 8px;margin-top:10px}
/* admin */
.ulist{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.urow{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;flex-wrap:wrap}
.urow .nm2{font-weight:500}
.urow .meta{color:var(--sub);font-size:12px;flex:1;min-width:160px}
.badge{font-size:11px;padding:2px 8px;border-radius:10px;background:#E9EDF3;color:var(--sub);font-weight:500}
.badge.wait{background:#FFF1DE;color:#B26100}
.badge.dup{background:#FDE7EA;color:var(--bad)}
.sec{font-size:13px;font-weight:700;margin:4px 0 8px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:60}
.toast.on{opacity:1}
.hl .bubble{animation:hl 1.8s}
@keyframes hl{0%{box-shadow:0 0 0 3px var(--cyan)}100%{box-shadow:0 0 0 0 transparent}}
@media (max-width:1200px){
  .app.info-on{grid-template-columns:68px 300px 1fr}
  .app.info-on .info{position:fixed;right:0;top:0;bottom:0;width:280px;z-index:20;box-shadow:-8px 0 24px rgba(0,0,0,.12)}
}
@media (max-width:820px){
  html,body{height:100%;overflow:hidden}
  .app,.app.info-on{grid-template-columns:1fr;height:100dvh}
  .rail{display:none}
  .list{display:none;border-right:0}
  .app.m-list .list{display:flex;padding-top:env(safe-area-inset-top);padding-bottom:calc(60px + env(safe-area-inset-bottom))}
  .app.m-list .main{display:none}
  .app.info-on .info{width:86vw}
  .lhead{padding:14px 16px 8px}
  .lhead h2{font-size:22px}
  .lsearch{font-size:16px}
  .li{padding:11px 10px}
  .li .nm{font-size:16px}
  .li .pv{font-size:13px}
  .av{width:46px;height:46px}
  .av.s{width:34px;height:34px}
  .row .avs{width:34px}
  .me{display:none}
  .top{padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top));gap:8px}
  .menu{display:block;font-size:28px;line-height:1;padding:0 6px 2px 0;color:var(--navy)}
  .top .desc,.qtop{display:none}
  .top .av{width:36px;height:36px}
  .msgs{padding:10px 12px}
  .row .col{max-width:80%}
  .composer{padding:8px 10px;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
  .composer textarea,.filters input,.filters select{font-size:16px}
  .composer .btn{padding:10px 16px}
  .sw{padding:12px;padding-bottom:calc(70px + env(safe-area-inset-bottom))}
  .filters select{flex:1}
  .filters input[type=search]{min-width:100%}
  .hint{display:none}
  .chips .hint{display:inline}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
  .app.m-chat .tabbar{display:none}
  .tabbar button{flex:1;background:none;border:0;padding:7px 0 8px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:var(--sub);position:relative}
  .tabbar button span.ri{font-size:21px}
  .tabbar button.on{color:var(--blue);font-weight:700}
  .tabbar .dot{right:calc(50% - 22px)}
  .toast{bottom:calc(80px + env(safe-area-inset-bottom))}
}
</style>

</head>
<body>
<!-- 로딩·등록·대기 화면 -->
<div class="gate" id="gLoad"><div class="card"><h1>FS Talk</h1><p id="loadMsg">연결 중…</p></div></div>
<div class="gate" id="gReg" hidden>
  <form class="card" id="regForm" autocomplete="off">
    <h1>FS Talk 사용 등록</h1>
    <p>처음 한 번만 등록하면 됩니다. 관리자가 승인하면 대화방이 열립니다.</p>
    <div id="rPick" hidden>
      <div class="f"><label for="pTeam">팀</label>
        <select id="pTeam"><option value="">전체 팀</option></select></div>
      <div class="f"><label for="pQ">이름 검색</label><input id="pQ" type="search" placeholder="이름 일부를 입력하세요 (예: 흥민)"></div>
      <div class="plist" id="pList"></div>
      <div class="psel" id="pSel" hidden></div>
      <button type="button" class="linkbtn" id="toManual">명단에 내 이름이 없어요 → 직접 입력</button>
    </div>
    <div id="rManual">
    <div class="f"><label for="rName">이름</label><input id="rName" maxlength="20" placeholder="예: 홍길동"></div>
    <div class="f"><label for="rTeam">소속</label>
      <select id="rTeam">
        <option value="">선택하세요</option>
        <option value="FSG">FSG (그룹장)</option>
        <option>FS WEST</option><option>FS EAST</option><option>FS CENTRAL</option><option>FS SOUTH</option><option>FSS Team</option><option>FSOM Team</option><option>기타</option>
      </select></div>
    <div class="f" id="rOfficeBox" hidden><label for="rOffice">사무소</label><select id="rOffice"></select></div>
    <button type="button" class="linkbtn" id="toPick" hidden>← 명단에서 고르기</button>
    </div>
    <button class="btn pri" type="submit" id="regBtn">등록 요청</button>
  </form>
</div>
<div class="gate" id="gWait" hidden>
  <div class="card">
    <h1>승인 대기 중</h1>
    <p id="waitMsg">등록 요청을 보냈습니다. 관리자가 승인하면 이 화면이 자동으로 바뀝니다.</p>
    <button class="btn" type="button" id="reRegBtn">등록 정보 고치기</button>
    <div class="uid" id="myUid"></div>
  </div>
</div>

<div class="app" id="app" hidden>
  <nav class="rail" id="rail">
    <div class="logo">FS</div>
    <button id="rChat" title="대화"><span class="ri">💬</span>대화</button>
    <button id="rOrg" title="조직도"><span class="ri">👥</span>조직도</button>
    <button id="rSearch" title="검색"><span class="ri">🔍</span>검색</button>
    <button id="rAdmin" title="관리" hidden><span class="ri">⚙️</span>관리</button>
    <div class="grow"></div>
    <div class="meav" id="meAv"></div>
  </nav>
  <aside class="list" id="side">
    <div class="lhead">
      <h2 id="lTitle">대화</h2>
      <input type="search" class="lsearch" id="lq" placeholder="검색">
    </div>
    <div class="litems" id="nav"></div>
    <div class="me" id="me"></div>
  </aside>
  <main class="main">
    <div class="top">
      <button class="menu" id="backBtn" aria-label="목록으로">‹</button>
      <div id="topAv"></div>
      <div><h2 id="title"></h2><div class="desc" id="desc"></div></div>
      <div class="grow"></div>
      <button class="tb" id="infoBtn" title="대화방 정보" aria-label="대화방 정보">☰</button>
    </div>
    <div class="banner" id="banner" hidden></div>

    <section class="view on" id="chatView">
      <div class="msgs" id="msgs"></div>
      <form class="composer" id="composer">
        <textarea id="input" rows="1" placeholder="메시지 입력"></textarea>
        <button class="btn pri" type="submit">전송</button>
      </form>
    </section>

    <section class="view" id="searchView">
      <div class="sw">
        <div class="filters">
          <input type="search" id="q" placeholder="예: XN-20 Pressure SV22 (띄어쓰기 = 모두 포함)">
          <select id="fRoom"></select>
          <select id="fPeriod"><option value="">전체 기간</option><option value="7">최근 7일</option><option value="30">최근 30일</option><option value="90">최근 90일</option><option value="365">최근 1년</option></select>
          <select id="fWho"><option value="">모든 사람</option><option value="me">내가 쓴 글</option></select>
        </div>
        <div class="hint">장비명·에러·병원·부품 등 대화에 나온 말이면 다 찾습니다. 대소문자와 띄어쓰기 차이는 무시해요. 결과를 누르면 그 대화로 이동합니다.</div>
        <div class="chips" id="chips"></div>
        <div class="sum"><span>검색 결과 <b id="cnt">–</b>건</span></div>
        <div class="res" id="res"></div>
      </div>
    </section>

    <section class="view" id="adminView">
      <div class="sw" id="adminBody"></div>
    </section>
  </main>
  <aside class="info" id="info"></aside>
  <nav class="tabbar" id="tabbar">
    <button id="tChat"><span class="ri">💬</span>대화</button>
    <button id="tOrg"><span class="ri">👥</span>조직도</button>
    <button id="tSearch"><span class="ri">🔍</span>검색</button>
    <button id="tAdmin" hidden><span class="ri">⚙️</span>관리</button>
  </nav>
</div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
(function(){
"use strict";
const APP_VERSION="2026-10-28.7";
const FIREBASE_CONFIG={

let uid=null,me=null,isAdmin=false;

$("loadMsg").textContent="연결 중…";
auth.onAuthStateChanged(u=>{
  if(!u){auth.signInAnonymously().catch(e=>{$("loadMsg").textContent="로그인 실패: "+(e.code||e.message)+" — 새로고침해 주세요.";});return;}
  uid=u.uid;$("myUid").textContent="기기 ID: "+uid;

      if(me){$("rName").value=me.name||"";$("rTeam").value=me.team||"";syncOffice();$("rOffice").value=me.office||"";}
      syncPickMode();

      show("gReg",false);show("gWait",true);show("app",false);

    }else if(me.status==="approved"){
      show("gReg",false);show("gWait",false);show("app",true);
      $("me").textContent=me.name+" · "+me.team+(me.office?" "+me.office:"");

  },err=>{$("loadMsg").textContent="데이터베이스 연결 실패("+(err&&err.code||"")+"). 관리자에게 알려 주세요.";show("gLoad",true);});
});

/* ---------- 등록 ---------- */
let roster={},picked=null,manual=false;
function rosterList(){const out=[];Object.keys(roster).forEach(t=>{const g=roster[t]||{};Object.keys(g).forEach(n=>out.push({team:t,name:n,office:typeof g[n]==="string"?g[n]:""}));});return out;}
const TEAM_ORDER=["FSG","FS WEST","FS EAST","FS CENTRAL","FS SOUTH","FSS Team","FSOM Team"];
const teamLabel=t=>t==="FSG"?"FSG 그룹장":t;
const teamRank=t=>{const i=TEAM_ORDER.indexOf(t);return i<0?99:i;};
let rosterWatched=false;
function watchRoster(){if(rosterWatched)return;rosterWatched=true;R("roster").on("value",s=>{roster=s.val()||{};syncPickMode();if(view==="admin")renderAdmin();if(started){renderNav();renderInfo();}},()=>{rosterWatched=false;roster={};syncPickMode();});}
function syncPickMode(){
  const has=rosterList().length>0;
  const usePick=has&&!manual;
  $("rPick").hidden=!usePick;$("rManual").hidden=usePick;$("toPick").hidden=!has;
  const sel=$("pTeam"),cur=sel.value;sel.textContent="";sel.appendChild(new Option("전체 팀",""));
  [...new Set(rosterList().map(p=>p.team))].sort((a,b)=>teamRank(a)-teamRank(b)||a.localeCompare(b,"ko")).forEach(t=>sel.appendChild(new Option(teamLabel(t),t)));
  sel.value=cur;
  if(usePick)renderPick();
}
function renderPick(){
  const q=$("pQ").value.replace(/\s+/g,""),t=$("pTeam").value,box=$("pList");box.textContent="";
  const list=rosterList().filter(p=>(!t||p.team===t)&&(!q||p.name.replace(/\s+/g,"").includes(q)))
    .sort((a,b)=>teamRank(a.team)-teamRank(b.team)||a.team.localeCompare(b.team,"ko")||a.name.localeCompare(b.name,"ko"));
  if(!list.length){box.appendChild(el("div","none","찾는 이름이 없습니다."));return;}
  let g="";
  list.forEach(p=>{
    if(p.team!==g){g=p.team;box.appendChild(el("div","grp",teamLabel(g)));}
    const b=el("button",picked&&picked.name===p.name&&picked.team===p.team?"on":"");b.type="button";
    b.appendChild(el("span",null,p.name));b.appendChild(el("small",null,p.office?p.office+" 사무소":""));
    b.onclick=()=>{picked=p;$("pSel").hidden=false;$("pSel").textContent="선택: "+p.name+" · "+teamLabel(p.team)+(p.office?" · "+p.office+" 사무소":"");renderPick();};
    box.appendChild(b);
  });
}
$("pQ").addEventListener("input",renderPick);
$("pTeam").addEventListener("change",renderPick);
$("toManual").onclick=()=>{manual=true;picked=null;$("pSel").hidden=true;syncPickMode();$("rName").focus();};
$("toPick").onclick=()=>{manual=false;syncPickMode();};
function syncOffice(){
  const t=$("rTeam").value,box=$("rOfficeBox"),sel=$("rOffice");
  const list=OFFICES[t];box.hidden=!list;sel.textContent="";
  if(list){sel.appendChild(new Option("선택하세요",""));list.forEach(o=>sel.appendChild(new Option(o+" 사무소",o)));}
}
$("rTeam").addEventListener("change",syncOffice);
$("regForm").addEventListener("submit",async e=>{
  e.preventDefault();
  let name,team,office;
  if(!$("rPick").hidden){
    if(!picked){toast("명단에서 이름을 골라 주세요.");return;}
    name=picked.name;team=picked.team;office=picked.office||"";
  }else{
    name=$("rName").value.trim().replace(/\s+/g," ");team=$("rTeam").value;office=OFFICES[team]?$("rOffice").value:"";
    if(name.length<2){toast("이름을 2자 이상 입력하세요.");return;}
    if(!team){toast("소속을 선택하세요.");return;}
    if(OFFICES[team]&&!office){toast("사무소를 선택하세요.");return;}
  }
  const data={name,team,office,status:"pending",createdAt:firebase.database.ServerValue.TIMESTAMP,ua:navigator.userAgent.slice(0,180)};
  $("regBtn").disabled=true;
  try{await R("users/"+uid).set(data);}catch(err){toast("등록 실패: "+(err.code||err.message));}
  finally{$("regBtn").disabled=false;}
});
$("reRegBtn").onclick=()=>{show("gWait",false);show("gReg",true);picked=null;$("pSel").hidden=true;$("rName").value=me.name||"";$("rTeam").value=me.team||"";syncOffice();$("rOffice").value=me.office||"";syncPickMode();};

/* ---------- 메시지 수신 ---------- */
let started=false,renderQ=false;
function start(){
  if(started){renderNav();return;}
  started=true;
  ROOMS.forEach(r=>{
    const q=R("msgs/"+r.id).orderByChild("ts").limitToLast(PER_ROOM);
    q.on("child_added",s=>{addMsg(r.id,s.key,s.val());});
    q.on("child_removed",s=>{const m=byId.get(s.key);if(m){byId.delete(s.key);msgs=msgs.filter(x=>x!==m);schedule();}});
  },);
  if(isAdmin)watchUsers();
  route();
}
function addMsg(roomId,key,v){
  if(!v||typeof v.text!=="string")return;
  if(byId.has(key))return;
  const m={id:key,room:roomId,text:v.text,ts:+v.ts||Date.now(),author:String(v.uid||""),name:String(v.name||"")};
  byId.set(key,m);
  if(msgs.length&&m.ts<msgs[msgs.length-1].ts){msgs.push(m);msgs.sort((a,b)=>a.ts-b.ts);}else msgs.push(m);
  schedule();
}
function schedule(){if(renderQ)return;renderQ=true;requestAnimationFrame(()=>{renderQ=false;refresh();});}
function refresh(){
  if(view==="chat"){renderMsgs(false);if(!(isM()&&mList))markSeen();}
  else if(view==="search")renderSearch();
  renderNav();
}
function markSeen(){const l=msgs.filter(m=>inRoom(m,room)).pop();if(l&&seen[room]!==l.ts){seen[room]=l.ts;try{localStorage.setItem("fstalk-seen",JSON.stringify(seen));}catch(e){}}}

/* ---------- 내비게이션 (메신저형) ---------- */
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const hm=d=>{const h=d.getHours();return (h<12?"오전 ":"오후 ")+((h%12)||12)+":"+pad(d.getMinutes());};
let pendingCount=0,listTab="rooms";
const TEAM_COLOR={"FSG":"#1A3A6B","FS WEST":"#009EE0","FS EAST":"#E8871E","FS CENTRAL":"#7A5CC4","FS SOUTH":"#1FA85C","FSS Team":"#D6336C","FSOM Team":"#0E7C86"};
const ROOM_LOOK={all:["전체","#1A3A6B"],notice:["공지","#E5484D"],ts:["FS","#005BAC"],cs:["CS","#0E9AA7"],west:["W","#009EE0"],east:["E","#E8871E"],central:["C","#7A5CC4"],daejeon:["대전","#9A7FD8"],gwangju:["광주","#9A7FD8"],south:["S","#1FA85C"],busan:["부산","#45BE7A"],daegu:["대구","#45BE7A"],fss:["FSS","#D6336C"],fsom:["OM","#0E7C86"]};
const ROOM_SCOPE={west:["FS WEST"],east:["FS EAST"],central:["FS CENTRAL"],daejeon:["FS CENTRAL","대전"],gwangju:["FS CENTRAL","광주"],south:["FS SOUTH"],busan:["FS SOUTH","부산"],daegu:["FS SOUTH","대구"],fss:["FSS Team"],fsom:["FSOM Team"]};
function personTeam(name){const p=rosterList().find(x=>x.name===name);return p||null;}
function avatar(label,color,cls){const a=el("div","av"+(cls?" "+cls:""),label);a.style.background=color;return a;}
function personAv(name,cls){const p=personTeam(name);return avatar(String(name||"?").slice(-2),(p&&TEAM_COLOR[p.team])||"#8A94A3",cls);}
function roomAv(id,cls){const l=ROOM_LOOK[id]||["?","#8A94A3"];return avatar(l[0],l[1],"sq"+(cls?" "+cls:""));}
function roomMembers(id){const sc=ROOM_SCOPE[id];const all=rosterList();if(!sc)return all;return all.filter(p=>p.team===sc[0]&&(!sc[1]||p.office===sc[1]));}
function unread(id){return msgs.filter(m=>inRoom(m,id)&&m.ts>(seen[id]||0)&&m.author!==uid).length;}
function totalUnread(){return msgs.filter(m=>m.author!==uid&&m.ts>(seen[m.room]||0)&&m.ts>(seen.all||0)).length;}
function fmtTime(ts){const d=new Date(ts),t=new Date();if(ymd(d)===ymd(t))return hm(d);const y=new Date(t);y.setDate(t.getDate()-1);if(ymd(d)===ymd(y))return "어제";return (d.getMonth()+1)+"월 "+d.getDate()+"일";}
function renderNav(){
  const nav=$("nav");nav.textContent="";
  const q=$("lq").value.replace(/\s+/g,"").toLowerCase();
  if(listTab==="org"){renderOrg(nav,q);}
  else{
    $("lTitle").textContent="대화";
    let grp="";
    ROOMS.forEach(r=>{
      if(q&&!r.name.replace(/\s+/g,"").toLowerCase().includes(q))return;
      if(!q&&r.grp!==grp){grp=r.grp;nav.appendChild(el("div","lgrp",grp==="팀"?"팀·사무소":"전체"));}
      const b=el("button","li"+(view==="chat"&&room===r.id&&!(isM()&&mList)?" on":"")+(r.sub&&!q?" sub":""));
      b.appendChild(roomAv(r.id,r.sub?"s":""));
      const last=msgs.filter(m=>inRoom(m,r.id)).pop();
      const mid=el("div","mid");
      const nm=el("div","nm",r.name);const n=roomMembers(r.id).length;if(n)nm.appendChild(el("small",null,String(n)));
      mid.appendChild(nm);
      mid.appendChild(el("div","pv",last?((r.id==="all"&&last.room!=="all"?"["+roomName(last.room)+"] ":"")+(last.name?last.name+": ":"")+last.text.replace(/\s+/g," ").slice(0,60)):r.desc));
      b.appendChild(mid);
      const rt=el("div","rt");
      if(last)rt.appendChild(el("span","tm",fmtTime(last.ts)));
      const u=unread(r.id);
      if(u&&!(view==="chat"&&room===r.id&&!mList))rt.appendChild(el("span","cnt",u>99?"99+":String(u)));
      b.appendChild(rt);
      b.onclick=()=>go("room-"+r.id);
      nav.appendChild(b);
    });
  }
  // 레일·탭바 상태
  const tu=totalUnread();
  [["rChat","tChat"],["rOrg","tOrg"],["rSearch","tSearch"],["rAdmin","tAdmin"]].forEach(([a,b],i)=>{
    const on=i===0?(view==="chat"&&listTab==="rooms"):i===1?listTab==="org"&&(view==="chat"):i===2?view==="search":view==="admin";
    const onM=isM()?(i===0?(mList&&listTab==="rooms"):i===1?(mList&&listTab==="org"):on):on;
    $(a).classList.toggle("on",on);$(b).classList.toggle("on",onM);
    [a,b].forEach(id=>{const e=$(id);const old=e.querySelector(".dot");if(old)old.remove();
      const n=i===0?tu:i===3?pendingCount:0;if(n){const d=el("span","dot",n>99?"99+":String(n));e.appendChild(d);}});
  });
  $("rAdmin").hidden=!isAdmin;$("tAdmin").hidden=!isAdmin;
  const ma=$("meAv");ma.textContent="";if(me){const a=personAv(me.name,"s");a.title=me.name;ma.appendChild(a);}
}
function renderOrg(nav,q){
  const list=rosterList().filter(p=>!q||p.name.includes(q)||p.team.toLowerCase().replace(/\s+/g,"").includes(q))
    .sort((a,b)=>teamRank(a.team)-teamRank(b.team)||(a.office||"").localeCompare(b.office||"","ko")||a.name.localeCompare(b.name,"ko"));
  $("lTitle").textContent="";$("lTitle").appendChild(document.createTextNode("조직도"));$("lTitle").appendChild(el("small",null,rosterList().length+"명"));
  if(!list.length){nav.appendChild(el("div","more",rosterList().length?"찾는 사람이 없습니다.":"관리자가 명단을 아직 등록하지 않았습니다."));return;}
  let g="";
  list.forEach(p=>{
    const key=teamLabel(p.team)+(p.office?" · "+p.office:"");
    if(key!==g){g=key;nav.appendChild(el("div","lgrp",key));}
    const b=el("button","li");
    b.appendChild(personAv(p.name));
    const mid=el("div","mid");mid.appendChild(el("div","nm",p.name+(me&&me.name===p.name?" (나)":"")));mid.appendChild(el("div","pv",teamLabel(p.team)+(p.office?" · "+p.office+" 사무소":"")));
    b.appendChild(mid);
    const target=Object.keys(ROOM_SCOPE).find(k=>{const sc=ROOM_SCOPE[k];return sc[0]===p.team&&sc[1]&&sc[1]===p.office;})||Object.keys(ROOM_SCOPE).find(k=>ROOM_SCOPE[k][0]===p.team&&!ROOM_SCOPE[k][1]);
    b.title=target?roomName(target)+" 방 열기":"";
    b.onclick=()=>{if(target){listTab="rooms";go("room-"+target);}};
    nav.appendChild(b);
  });
}
let infoOn=(()=>{try{return localStorage.getItem("fstalk-info")!=="0";}catch(e){return true;}})();
function renderInfo(){
  const box=$("info");box.textContent="";
  const on=view==="chat"&&!(isM()&&mList)&&(isM()||window.innerWidth<=1200?infoOpen:infoOn);
  $("app").classList.toggle("info-on",on);
  if(!on)return;
  const r=ROOMS.find(x=>x.id===room);const mem=roomMembers(room);
  const h=el("div","ih");h.appendChild(roomAv(room));h.appendChild(el("b",null,r.name));h.appendChild(el("span",null,r.desc));box.appendChild(h);
  const l=el("div","il");l.appendChild(el("div","lgrp","참여자 "+mem.length+"명"));
  mem.sort((a,b)=>teamRank(a.team)-teamRank(b.team)||a.name.localeCompare(b.name,"ko")).forEach(p=>{
    const m=el("div","mem");m.appendChild(personAv(p.name,"s"));const t=el("div");t.appendChild(document.createTextNode(p.name));t.appendChild(el("br"));t.appendChild(el("small",null,teamLabel(p.team)+(p.office?" · "+p.office:"")));m.appendChild(t);l.appendChild(m);
  });
  if(!mem.length)l.appendChild(el("div","more","명단이 등록되면 참여자가 표시됩니다."));
  box.appendChild(l);
}
let infoOpen=false;
$("infoBtn").onclick=()=>{
  if(isM()||window.innerWidth<=1200)infoOpen=!infoOpen;
  else{infoOn=!infoOn;try{localStorage.setItem("fstalk-info",infoOn?"1":"0");}catch(e){}}
  renderInfo();
};
document.addEventListener("click",e=>{if(infoOpen&&!$("info").contains(e.target)&&e.target!==$("infoBtn")){infoOpen=false;renderInfo();}});
function showView(){
  ["chatView","searchView","adminView"].forEach(v=>$(v).classList.toggle("on",v===view+"View"));
  const ta=$("topAv");ta.textContent="";$("infoBtn").hidden=view!=="chat";
  if(view==="chat"){const r=ROOMS.find(x=>x.id===room);ta.appendChild(roomAv(room,"s"));$("title").textContent=r.name;const n=roomMembers(room).length;$("desc").textContent=(n?n+"명 · ":"")+r.desc;renderMsgs(true);if(!(isM()&&mList))markSeen();}
  else if(view==="search"){$("title").textContent="대화 검색";$("desc").textContent="모든 방에서 방마다 최근 "+PER_ROOM+"건을 찾습니다";renderSearch();}
  else{$("title").textContent="관리";$("desc").textContent="등록 승인 · 관리자 지정 · 직원 명단";renderAdmin();}
  const ml=isM()&&mList;
  $("app").classList.toggle("m-list",ml);
  $("app").classList.toggle("m-chat",isM()&&!ml&&view==="chat");
  renderNav();renderInfo();
}
function go(h){if(location.hash.slice(1)!==h)location.hash=h;route();}
function route(){
  if(!started)return;
  const h=location.hash.slice(1);
  infoOpen=false;
  if(h==="search"){view="search";mList=false;}
  else if(h==="admin"&&isAdmin){view="admin";mList=false;}
  else if(h==="org"){listTab="org";view="chat";mList=true;}
  else if(h.indexOf("room-")===0&&ROOMS.some(r=>r.id===h.slice(5))){room=h.slice(5);view="chat";mList=false;}
  else{listTab="rooms";mList=true;view="chat";}
  if(h!=="org"&&h.indexOf("room-")!==0)listTab="rooms";
  showView();
}
window.addEventListener("hashchange",route);
window.addEventListener("resize",()=>{if(started)renderInfo();});
window.matchMedia("(max-width:820px)").addEventListener("change",()=>{if(started)showView();});
$("backBtn").onclick=()=>{if(history.length>1&&location.hash)history.back();else go("");};
$("rChat").onclick=$("tChat").onclick=()=>{listTab="rooms";$("lq").value="";isM()?go(""):(view!=="chat"?go("room-"+room):renderNav());};
$("rOrg").onclick=$("tOrg").onclick=()=>{$("lq").value="";if(isM())go("org");else{listTab="org";if(view!=="chat")go("room-"+room);else renderNav();}};

/* ---------- 검색 매칭 ---------- */
function squash(s){const out=[],map=[];const low=String(s).toLowerCase();for(let i=0;i<low.length;i++){if(!/\s/.test(low[i])){out.push(low[i]);map.push(i);}}return{c:out.join(""),map};}
const terms=q=>q.toLowerCase().split(/\s+/).map(t=>t.replace(/^#/,"")).filter(Boolean);
function ranges(text,ts){const {c,map}=squash(text),r=[];ts.forEach(t=>{let i=0;while((i=c.indexOf(t,i))>=0){r.push([map[i],map[i+t.length-1]+1]);i+=t.length;}});r.sort((a,b)=>a[0]-b[0]);const m=[];r.forEach(x=>{if(m.length&&x[0]<=m[m.length-1][1])m[m.length-1][1]=Math.max(m[m.length-1][1],x[1]);else m.push(x.slice());});return m;}
function richText(text,ts){
  const f=document.createDocumentFragment();
  const hl=ts&&ts.length?ranges(text,ts):[];
  const tagR=[];const re=/#[^\s#]+/g;let mm;while((mm=re.exec(text)))tagR.push([mm.index,mm.index+mm[0].length]);
  const cuts=new Set([0,text.length]);hl.concat(tagR).forEach(([a,b])=>{cuts.add(a);cuts.add(b);});
  const pts=[...cuts].sort((a,b)=>a-b);
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i],b=pts[i+1],seg=text.slice(a,b);if(!seg)continue;
    const inH=hl.some(([x,y])=>a>=x&&b<=y),inT=tagR.some(([x,y])=>a>=x&&b<=y);
    let node=document.createTextNode(seg);
    if(inT){const s=el("span","tag");s.appendChild(node);node=s;}
    if(inH){const k=el("mark");k.appendChild(node);node=k;}
    f.appendChild(node);
  }
  return f;
}

/* ---------- 대화 ---------- */
let jumpId=null,jumpTerms=null,selId=null;
function renderMsgs(scroll){
  const box=$("msgs"),atBottom=box.scrollHeight-box.scrollTop-box.clientHeight<80;
  box.textContent="";
  const list=msgs.filter(m=>inRoom(m,room));
  if(!list.length){const e=el("div","empty");e.appendChild(document.createTextNode("아직 대화가 없습니다."));e.appendChild(el("br"));e.appendChild(document.createTextNode("첫 메시지를 남겨 보세요."));box.appendChild(e);return;}
  const same=(a,b)=>a&&b&&a.author===b.author&&a.room===b.room&&ymd(new Date(a.ts))===ymd(new Date(b.ts))&&Math.abs(b.ts-a.ts)<120000&&hm(new Date(a.ts))===hm(new Date(b.ts));
  let lastDay="";
  list.forEach((m,i)=>{
    const d=new Date(m.ts),day=ymd(d);
    if(day!==lastDay){box.appendChild(el("div","day",d.getFullYear()+"년 "+(d.getMonth()+1)+"월 "+d.getDate()+"일 "+"일월화수목금토"[d.getDay()]+"요일"));lastDay=day;}
    const prev=list[i-1],next=list[i+1];
    const cont=same(prev,m)&&ymd(new Date(prev.ts))===day,lastOfGroup=!same(m,next);
    const mine=m.author===uid;
    const row=el("div","row"+(mine?" mine":"")+(cont?" cont":"")+(selId===m.id?" sel":"")+(isAdmin&&!mine?" adm":""));row.id="m-"+m.id;
    if(!mine){const avs=el("div","avs");if(!cont)avs.appendChild(personAv(m.name,"s"));row.appendChild(avs);}
    const col=el("div","col");
    if(!cont&&(!mine||(room==="all"&&m.room!=="all"))){
      const who=el("div","who");
      if(!mine)who.appendChild(el("b",null,m.name||"알 수 없음"));
      if(room==="all"&&m.room!=="all")who.appendChild(el("span","rb",roomName(m.room)));
      col.appendChild(who);
    }
    const line=el("div","line");
    const b=el("div","bubble");b.appendChild(richText(m.text,jumpId===m.id?jumpTerms:null));
    if(mine||isAdmin)b.onclick=()=>{selId=selId===m.id?null:m.id;renderMsgs(false);};
    line.appendChild(b);
    const meta=el("div","meta2");
    if(mine||isAdmin){const del=el("button","del","삭제");del.onclick=ev=>{ev.stopPropagation();removeMsg(m);};meta.appendChild(del);}
    if(lastOfGroup)meta.appendChild(el("span",null,hm(d)));
    line.appendChild(meta);
    col.appendChild(line);
    row.appendChild(col);
    box.appendChild(row);
  });
  if(jumpId){const e=document.getElementById("m-"+jumpId);if(e){e.scrollIntoView({block:"center"});e.classList.add("hl");}jumpId=null;}
  else if(scroll||atBottom)box.scrollTop=box.scrollHeight;
}
async function removeMsg(m){
  if(removeMsg._arm!==m.id){removeMsg._arm=m.id;toast("한 번 더 누르면 삭제됩니다.");setTimeout(()=>{if(removeMsg._arm===m.id)removeMsg._arm=null;},3000);return;}
  removeMsg._arm=null;
  try{await R("msgs/"+m.room+"/"+m.id).remove();selId=null;toast("삭제했습니다.");}catch(e){toast("삭제 실패: "+(e.code||e.message));}
}
const input=$("input");
input.addEventListener("input",()=>{input.style.height="auto";input.style.height=Math.min(input.scrollHeight,160)+"px";});
input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing&&!isM()){e.preventDefault();$("composer").requestSubmit();}});
$("composer").addEventListener("submit",async e=>{
  e.preventDefault();const t=input.value.trim();if(!t)return;
  if(t.length>4000){toast("메시지가 너무 깁니다 (4,000자 이하).");return;}
  input.value="";input.style.height="auto";
  try{
    await R("msgs/"+room).push({uid,name:me.name,text:t,ts:firebase.database.ServerValue.TIMESTAMP});
  }catch(err){input.value=t;toast("전송 실패: "+(err.code||err.message));}
});
function setPlaceholder(){input.placeholder=isM()?"메시지 입력":"메시지 입력 (Enter 전송, Shift+Enter 줄바꿈) · #XN-20 처럼 태그를 달면 검색이 쉬워요";}
setPlaceholder();window.matchMedia("(max-width:820px)").addEventListener("change",setPlaceholder);

/* ---------- 검색 ---------- */
$("fRoom").appendChild(new Option("모든 방",""));ROOMS.forEach(r=>$("fRoom").appendChild(new Option((r.sub?"  └ ":"")+(r.id==="all"?"전체방에 직접 쓴 글":r.name),r.id)));
function renderSearch(){
  const box=$("chips");box.textContent="";
  const cnt={};msgs.forEach(m=>{(m.text.match(/#[^\s#]+/g)||[]).forEach(t=>{cnt[t]=(cnt[t]||0)+1;});});
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,12);
  if(top.length){box.appendChild(el("span","hint","자주 쓴 태그:"));top.forEach(([t,n])=>{const c=el("button","chip",t+" "+n);c.onclick=()=>{$("q").value=t;renderSearch();};box.appendChild(c);});}
  const ts=terms($("q").value),fr=$("fRoom").value,fp=+$("fPeriod").value||0,fw=$("fWho").value;
  const res=$("res");res.textContent="";
  if(!ts.length&&!fr&&!fw&&!fp){$("cnt").textContent="–";res.appendChild(el("div","more","검색어를 입력하거나 방·기간을 고르세요."));return;}
  const since=fp?Date.now()-fp*864e5:0;
  const hits=msgs.filter(m=>{
    if(fr&&m.room!==fr)return false;
    if(since&&m.ts<since)return false;
    if(fw==="me"&&m.author!==uid)return false;
    if(ts.length){const c=squash(m.text).c;if(!ts.every(t=>c.includes(t)))return false;}
    return true;
  }).sort((a,b)=>b.ts-a.ts);
  $("cnt").textContent=hits.length;
  if(!hits.length){res.appendChild(el("div","more","찾는 내용이 없습니다. 단어를 줄이거나 다른 표현으로 검색해 보세요."));return;}
  hits.slice(0,200).forEach(m=>{
    const h=el("div","hit"),meta=el("div","meta");
    meta.appendChild(el("span","rb",roomName(m.room)));meta.appendChild(el("span",null,m.name));
    const d=new Date(m.ts);meta.appendChild(el("span",null,ymd(d)+" "+hm(d)));
    h.appendChild(meta);
    const tx=el("div","tx");tx.appendChild(richText(m.text.length>600?m.text.slice(0,600)+"…":m.text,ts));h.appendChild(tx);
    h.onclick=()=>{jumpId=m.id;jumpTerms=ts;go("room-"+m.room);};
    res.appendChild(h);
  });
  if(hits.length>200)res.appendChild(el("div","more","최근 200건만 표시했습니다. 검색어를 더 구체적으로 넣어 보세요."));
}
let tmr;["q","fRoom","fPeriod","fWho"].forEach(id=>$(id).addEventListener(id==="q"?"input":"change",()=>{clearTimeout(tmr);tmr=setTimeout(renderSearch,120);}));


/* ---------- 관리자: 사용자 승인 ---------- */
let users={},usersWatched=false,admins={};
function watchUsers(){
  if(usersWatched)return;usersWatched=true;
  R("admins").on("value",s=>{admins=s.val()||{};if(view==="admin")renderAdmin();},()=>{});
  R("users").on("value",s=>{users=s.val()||{};pendingCount=Object.values(users).filter(u=>u&&u.status==="pending").length;if(view==="admin")renderAdmin();renderNav();},
    e=>{usersWatched=false;toast("사용자 목록을 읽지 못했습니다: "+(e.code||""));});
}
async function setAdmin(id,on){
  try{if(on)await R("admins/"+id).set(true);else await R("admins/"+id).remove();toast(on?"관리자로 지정했습니다.":"관리자 지정을 해제했습니다.");}
  catch(e){toast("변경 실패: "+(e.code||e.message)+" — DB 규칙이 최신인지 확인하세요.");}
}
async function setStatus(id,status){
  try{await R("users/"+id+"/status").set(status);toast(status==="approved"?"승인했습니다.":status==="rejected"?"거절했습니다.":"변경했습니다.");}
  catch(e){toast("변경 실패: "+(e.code||e.message));}
}
function rosterText(){return rosterList().sort((a,b)=>teamRank(a.team)-teamRank(b.team)||a.name.localeCompare(b.name,"ko")).map(p=>p.team+","+p.name+(p.office?","+p.office:"")).join("\n");}
async function saveRoster(text){
  const out={};let n=0;const bad=[];
  text.split(/\r?\n/).forEach((line,i)=>{
    const t=line.trim();if(!t)return;
    const [team,name,office]=t.split(/\s*,\s*/);
    if(!team||!name||/[.#$\[\]\/]/.test(team+name)){bad.push(i+1);return;}
    (out[team]=out[team]||{})[name]=office||"";n++;
  });
  if(bad.length){toast("형식이 잘못된 줄: "+bad.slice(0,5).join(", ")+"번째");return;}
  try{await R("roster").set(n?out:null);toast("명단 "+n+"명을 저장했습니다.");}catch(e){toast("저장 실패: "+(e.code||e.message)+" — DB 규칙이 최신인지 확인하세요.");}
}
function renderRosterEditor(body){
  body.appendChild(el("div","sec","등록용 직원 명단 ("+rosterList().length+"명)"));
  body.appendChild(el("div","hint","한 줄에 한 명: 팀,이름,사무소 (사무소는 FS CENTRAL·FS SOUTH만). 직원이 처음 접속할 때 이 명단에서 팀과 이름을 골라 등록합니다."));
  const ta=el("textarea","rost");ta.value=rosterText();ta.placeholder="FS WEST,홍길동\nFS SOUTH,김철수,부산";
  body.appendChild(ta);
  const b=el("button","btn pri","명단 저장");b.style.margin="8px 0 24px";b.onclick=()=>saveRoster(ta.value);body.appendChild(b);
}
function renderAdmin(){
  const body=$("adminBody");
  const keep=body.querySelector(".rost");if(keep&&document.activeElement===keep)return;
  body.textContent="";
  const list=Object.entries(users).filter(([,u])=>u&&u.name);
  const nameCount={};list.forEach(([,u])=>{if(u.status==="approved"||u.status==="pending")nameCount[u.name]=(nameCount[u.name]||0)+1;});
  const groups=[["pending","승인 대기"],["approved","승인됨"],["rejected","거절됨"]];
  groups.forEach(([st,label])=>{
    const rows=list.filter(([,u])=>u.status===st).sort((a,b)=>(a[1].team+a[1].name).localeCompare(b[1].team+b[1].name,"ko"));
    body.appendChild(el("div","sec",label+" "+rows.length+"명(기기)"));
    const ul=el("div","ulist");
    if(!rows.length)ul.appendChild(el("div","more","없음"));
    rows.forEach(([id,u])=>{
      const r=el("div","urow");
      r.appendChild(el("span","nm2",u.name));
      if(st==="pending")r.appendChild(el("span","badge wait","대기"));
      if(nameCount[u.name]>1)r.appendChild(el("span","badge dup","같은 이름 기기 "+nameCount[u.name]+"대"));
      if(id===uid)r.appendChild(el("span","badge","나"));
      if(admins[id]===true)r.appendChild(el("span","badge","관리자"));
      const dev=/iPhone|iPad/.test(u.ua||"")?"iPhone":/Android/.test(u.ua||"")?"Android":"PC";
      r.appendChild(el("span","meta",u.team+(u.office?" · "+u.office:"")+" · "+dev+(u.createdAt?" · "+ymd(new Date(u.createdAt)):"")));
      if(st!=="approved"){const b=el("button","btn pri","승인");b.onclick=()=>setStatus(id,"approved");r.appendChild(b);}
      if(st==="pending"){const b=el("button","btn bad","거절");b.onclick=()=>setStatus(id,"rejected");r.appendChild(b);}
      if(st==="approved"&&id!==uid){
        const a=el("button","btn",admins[id]===true?"관리자 해제":"관리자로 지정");a.onclick=()=>setAdmin(id,admins[id]!==true);r.appendChild(a);
        const b=el("button","btn bad","사용 중지");b.onclick=()=>{if(admins[id]===true)setAdmin(id,false);setStatus(id,"rejected");};r.appendChild(b);}
      ul.appendChild(r);
    });
    body.appendChild(ul);
  });
  renderRosterEditor(body);
}
